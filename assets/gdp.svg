<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img"><title>Nominal value and unchanged quantities</title><rect width="800" height="480" fill="#ECE6D8"/><g font-family="Arial,sans-serif" fill="#0F2742"><text x="60" y="45" font-size="26" text-anchor="start">Same quantity. A different dollar value.</text><text x="65" y="110" font-size="28" text-anchor="start">Period A</text><line x1="65" y1="130" x2="365" y2="130" stroke="#B9B9B0"/><text x="65" y="185" font-size="17" text-anchor="start">Quantity</text><text x="355" y="185" font-size="23" text-anchor="end">100 items</text><text x="65" y="250" font-size="17" text-anchor="start">Price per item</text><text x="355" y="250" font-size="23" text-anchor="end">$1</text><line x1="65" y1="285" x2="365" y2="285" stroke="#B9B9B0"/><text x="65" y="335" font-size="17" text-anchor="start">Nominal value</text><text x="355" y="335" font-size="28" text-anchor="end">$100</text><text x="430" y="110" font-size="28" text-anchor="start">Period B</text><line x1="430" y1="130" x2="730" y2="130" stroke="#B9B9B0"/><text x="430" y="185" font-size="17" text-anchor="start">Quantity</text><text x="720" y="185" font-size="23" text-anchor="end">100 items</text><text x="430" y="250" font-size="17" text-anchor="start">Price per item</text><text x="720" y="250" font-size="23" text-anchor="end">$2</text><line x1="430" y1="285" x2="730" y2="285" stroke="#B9B9B0"/><text x="430" y="335" font-size="17" text-anchor="start">Nominal value</text><text x="720" y="335" font-size="28" text-anchor="end">$200</text><text x="65" y="425" font-size="18" text-anchor="start">Illustrative example: real output is unchanged.</text></g></svg>